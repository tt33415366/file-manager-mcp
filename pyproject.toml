[project]
name = "file-manager-mcp"
version = "0.1.0"
description = "MCP server that lets remote agents manage files on the local PC"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "mcp>=2.3,<3",
    "starlette>=1.0.1",
    "uvicorn>=0.30",
]

[project.scripts]
file-manager-mcp = "file_manager_mcp.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "httpx>=0.27",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/file_manager_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
